name: Instalador Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - scripts/**
      - electron/**
      - server/**
      - prisma/**
      - .github/workflows/build-installer.yml

# Necesario para poder crear el tag de versión y el Release al final.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run dist:win

      # No hay forma de "ver" la ventana en un runner de GitHub, pero sí se
      # puede confirmar que el programa arranca y se queda corriendo (en vez
      # de crashear al toque, que es justo lo que veníamos arreglando).
      - name: Verificar que la app arranca sin crashear
        shell: pwsh
        run: |
          $exe = "release\win-unpacked\La Gran Carnicería POS.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "No se encontró el ejecutable en $exe"
            exit 1
          }
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Error "La app se cerró sola (código de salida: $($proc.ExitCode)) - probablemente crasheó al iniciar."
            exit 1
          }
          Write-Host "La app sigue corriendo después de 10 segundos - arrancó bien."
          Stop-Process -Id $proc.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: release/*.exe
          if-no-files-found: error

      # Calcula la próxima versión a partir del último tag "vX.Y.Z" (empieza
      # en v0.1.0 si todavía no existe ninguno) y sube un número de PATCH en
      # cada build — así cada instalador queda identificado con un número
      # que siempre sube, sin tener que acordarse de editarlo a mano.
      - name: Calcular próxima versión
        id: version
        shell: bash
        run: |
          git fetch --tags
          latest=$(git tag -l 'v*' | sort -t. -k1.2,1n -k2,2n -k3,3n | tail -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            version="${latest#v}"
            IFS='.' read -r major minor patch <<< "$version"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Próxima versión: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "fecha=$(date +%d-%m-%Y)" >> "$GITHUB_OUTPUT"

      - name: Publicar Release con el instalador
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }} — ${{ steps.version.outputs.fecha }}
          body: |
            Instalador generado automáticamente desde el commit ${{ github.sha }}.

            ${{ github.event.head_commit.message }}
          files: release/*.exe
